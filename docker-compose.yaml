services:
  play:
    image: thecodingmachine/nodejs:v2-20-bullseye
    command: npm run dev
    working_dir: /usr/src/app/play
    volumes:
    - .:/usr/src/app
    tmpfs: /tmp
    environment:
      STARTUP_COMMAND_1: ../wait-proto.sh
      STARTUP_COMMAND_2: ../npm-install.sh
      STARTUP_COMMAND_3: npm run typesafe-i18n
      DEBUG: socket,space
      DEBUG_COLORS: 'true'
      DEBUG_ERROR_MESSAGES: 'true'
      DEBUG_MODE: $DEBUG_MODE
      JITSI_URL: $JITSI_URL
      JITSI_PRIVATE_MODE: $JITSI_PRIVATE_MODE
      ENABLE_MAP_EDITOR: $ENABLE_MAP_EDITOR
      HOST: 0.0.0.0
      NODE_ENV: development
      ALLOWED_CORS_ORIGIN: https://aldeia.primatus.com.br
      VITE_URL: http://aldeia.primatus.com.br
      PUSHER_URL: https://aldeia.primatus.com.br/
      FRONT_URL: https://aldeia.primatus.com.br
      UPLOADER_URL: https://aldeia.primatus.com.br/uploader
      ICON_URL: https://aldeia.primatus.com.br/icon
      STUN_SERVER: ${STUN_SERVER:-}
      TURN_SERVER: ${TURN_SERVER:-}
      DISABLE_NOTIFICATIONS: $DISABLE_NOTIFICATIONS
      SKIP_RENDER_OPTIMIZATIONS: $SKIP_RENDER_OPTIMIZATIONS
      TURN_USER: ''
      TURN_PASSWORD: ''
      TURN_STATIC_AUTH_SECRET: $TURN_STATIC_AUTH_SECRET
      MAX_PER_GROUP: $MAX_PER_GROUP
      MAX_USERNAME_LENGTH: $MAX_USERNAME_LENGTH
      OPENID_CLIENT_ID: authorization-code-client-id
      OPENID_CLIENT_SECRET: authorization-code-client-secret
      OPENID_CLIENT_ISSUER: http://oidc.workadventure.localhost
      OPENID_PROFILE_SCREEN_PROVIDER: ${OPENID_PROFILE_SCREEN_PROVIDER:-}
      OPENID_SCOPE: profile openid email tags-scope
      OPENID_PROMPT: ${OPENID_PROMPT:-}
      OPENID_USERNAME_CLAIM: ${OPENID_USERNAME_CLAIM:-}
      OPENID_LOCALE_CLAIM: ${OPENID_LOCALE_CLAIM:-}
      OPENID_LOGOUT_REDIRECT_URL: ${OPENID_LOGOUT_REDIRECT_URL:-}
      SECRET_KEY: $SECRET_KEY
      ADMIN_API_URL: ${ADMIN_API_URL:-}
      ADMIN_API_TOKEN: $ADMIN_API_TOKEN
      MAP_STORAGE_API_TOKEN: FFVSGBSGBSGFB23SFGBSFG4BS
      API_URL: back:50051
      DISABLE_ANONYMOUS: $DISABLE_ANONYMOUS
      PUBLIC_MAP_STORAGE_URL: https://aldeia.primatus.com.br/map-storage
      INTERNAL_MAP_STORAGE_URL: http://map-storage:3000
      REDIS_HOST: redis
      ENABLE_OPENAPI_ENDPOINT: 'true'
      START_ROOM_URL: $START_ROOM_URL
      ENABLE_CHAT: $ENABLE_CHAT
      ENABLE_CHAT_UPLOAD: $ENABLE_CHAT_UPLOAD
      ENABLE_CHAT_ONLINE_LIST: $ENABLE_CHAT_ONLINE_LIST
      ENABLE_CHAT_DISCONNECTED_LIST: $ENABLE_CHAT_DISCONNECTED_LIST
      ENABLE_TUTORIAL: $ENABLE_TUTORIAL
      DEFAULT_WOKA_NAME: ${DEFAULT_WOKA_NAME:-}
      DEFAULT_WOKA_TEXTURE: ${DEFAULT_WOKA_TEXTURE:-}
      SKIP_CAMERA_PAGE: ${SKIP_CAMERA_PAGE:-false}
      BYPASS_PWA: ${BYPASS_PWA:-false}
      PROVIDE_DEFAULT_WOKA_NAME: ${PROVIDE_DEFAULT_WOKA_NAME:-}
      PROVIDE_DEFAULT_WOKA_TEXTURE: ${PROVIDE_DEFAULT_WOKA_TEXTURE:-}
      SERVER_NAME: $SERVER_NAME
      SERVER_MOTD: $SERVER_MOTD
      SERVER_ICON: $SERVER_ICON
      ENABLE_REPORT_ISSUES_MENU: $ENABLE_REPORT_ISSUES_MENU
      REPORT_ISSUES_URL: $REPORT_ISSUES_URL
      LOGROCKET_ID: $LOGROCKET_ID
      SENTRY_DSN_FRONT: ${SENTRY_DSN_FRONT:-}
      SENTRY_DSN_PUSHER: ${SENTRY_DSN_PUSHER:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      ROOM_API_PORT: '50051'
      ROOM_API_SECRET_KEY: ${ROOM_API_SECRET_KEY}
      FEATURE_FLAG_BROADCAST_AREAS: 'true'
      KLAXOON_ENABLED: $KLAXOON_ENABLED
      KLAXOON_CLIENT_ID: ${KLAXOON_CLIENT_ID:-}
      YOUTUBE_ENABLED: $YOUTUBE_ENABLED
      GOOGLE_DRIVE_ENABLED: $GOOGLE_DRIVE_ENABLED
      GOOGLE_DOCS_ENABLED: $GOOGLE_DOCS_ENABLED
      GOOGLE_SHEETS_ENABLED: $GOOGLE_SHEETS_ENABLED
      GOOGLE_SLIDES_ENABLED: $GOOGLE_SLIDES_ENABLED
      ERASER_ENABLED: $ERASER_ENABLED
      EXCALIDRAW_ENABLED: $EXCALIDRAW_ENABLED
      EXCALIDRAW_DOMAINS: ${EXCALIDRAW_DOMAINS:-}
      EMBEDDED_DOMAINS_WHITELIST: ${EMBEDDED_DOMAINS_WHITELIST:-}
      CARDS_ENABLED: $CARDS_ENABLED
      TLDRAW_ENABLED: $TLDRAW_ENABLED
      ACTIVE_REPORT_ISSUES_MENU: 'true'
      URL_REPORT_ISSUES: https://github.com/workadventure/workadventure/issues
      GOOGLE_DRIVE_PICKER_CLIENT_ID: ${GOOGLE_DRIVE_PICKER_CLIENT_ID:-}
      GOOGLE_DRIVE_PICKER_APP_ID: ${GOOGLE_DRIVE_PICKER_APP_ID:-}
      MINIMUM_DISTANCE: ${MINIMUM_DISTANCE}
      MATRIX_API_URI: http://synapse:8008/
      MATRIX_PUBLIC_URI: http://matrix.workadventure.localhost
      MATRIX_ADMIN_USER: admin
      MATRIX_ADMIN_PASSWORD: MySecretPassword
      MATRIX_DOMAIN: matrix.workadventure.localhost
      EMBEDLY_KEY: $EMBEDLY_KEY
      MAP_EDITOR_ALLOW_ALL_USERS: 'false'
      MAX_DISPLAYED_VIDEOS: ${MAX_DISPLAYED_VIDEOS:-}
      LIVEKIT_PIXEL_DENSITY: ${LIVEKIT_PIXEL_DENSITY:-}
      BACKGROUND_TRANSFORMER_ENGINE: ${BACKGROUND_TRANSFORMER_ENGINE:-}
    labels:
    - traefik.enable=true
    - traefik.http.routers.play.rule=Host(`aldeia.primatus.com.br`) && PathPrefix(`/`)
    - traefik.http.routers.play.priority=1
    - traefik.http.routers.play.service=play
    - traefik.http.services.play.loadbalancer.server.port=3000
    - traefik.http.routers.play-ws.rule=Host(`aldeia.primatus.com.br`) && PathPrefix(`/ws/`)
    - traefik.http.routers.play-ws.priority=2
    - traefik.http.routers.play-ws.service=play-ws
    - traefik.http.services.play-ws.loadbalancer.server.port=3001
  maps:
    image: thecodingmachine/php:8.1-v4-apache-node12
    environment:
      DEBUG_MODE: $DEBUG_MODE
      HOST: 0.0.0.0
      NODE_ENV: development
      FRONT_URL: https://aldeia.primatus.com.br
      STARTUP_COMMAND_0: sudo a2enmod headers
      STARTUP_COMMAND_1: yarn install
    volumes:
    - ./maps:/var/www/html
    labels:
    - traefik.enable=true
    - traefik.http.routers.maps.rule=Host(`maps.aldeia.primatus.com.br`)
    - traefik.http.routers.maps.entryPoints=websecure
    - traefik.http.routers.maps.tls.certResolver=letsencrypt
    - traefik.http.services.maps.loadbalancer.server.port=80
  back:
    image: thecodingmachine/nodejs:v2-22-bullseye
    command: npm run dev
    working_dir: /usr/src/app/back
    environment:
      PLAY_URL: https://aldeia.primatus.com.br
      MINIMUM_DISTANCE: ${MINIMUM_DISTANCE}
      GROUP_RADIUS: ${GROUP_RADIUS}
      STARTUP_COMMAND_1: ../wait-proto.sh
      STARTUP_COMMAND_2: ../npm-install.sh
      SECRET_KEY: $SECRET_KEY
      SECRET_JITSI_KEY: $SECRET_JITSI_KEY
      ENABLE_MAP_EDITOR: $ENABLE_MAP_EDITOR
      ALLOW_ARTILLERY: 'true'
      ADMIN_API_URL: ${ADMIN_API_URL:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      JITSI_URL: $JITSI_URL
      JITSI_ISS: $JITSI_ISS
      BBB_URL: $BBB_URL
      BBB_SECRET: $BBB_SECRET
      MAX_PER_GROUP: $MAX_PER_GROUP
      REDIS_HOST: redis
      NODE_ENV: development
      STORE_VARIABLES_FOR_LOCAL_MAPS: 'true'
      PROMETHEUS_AUTHORIZATION_TOKEN: $PROMETHEUS_AUTHORIZATION_TOKEN
      MAP_STORAGE_URL: map-storage:50053
      PUBLIC_MAP_STORAGE_URL: https://aldeia.primatus.com.br/map-storage
      INTERNAL_MAP_STORAGE_URL: http://map-storage:3000
      PLAYER_VARIABLES_MAX_TTL: $PLAYER_VARIABLES_MAX_TTL
      ENABLE_CHAT: $ENABLE_CHAT
      ENABLE_CHAT_UPLOAD: $ENABLE_CHAT_UPLOAD
      SENTRY_DSN: ${SENTRY_DSN_BACK:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
    - .:/usr/src/app
    tmpfs: /tmp
    labels:
    - traefik.enable=true
    - traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/api
    - traefik.http.routers.back.rule=Host(`aldeia.primatus.com.br`) && PathPrefix(`/api`)
    - traefik.http.routers.back.priority=2
    - traefik.http.routers.back.middlewares=strip-api-prefix@docker
    - traefik.http.routers.back.entryPoints=web
    - traefik.http.routers.back.service=back
    - traefik.http.services.back.loadbalancer.server.port=8080
  map-storage:
    image: thecodingmachine/nodejs:v2-22-bullseye
    command: npm run start:dev
    working_dir: /usr/src/app/map-storage
    environment:
      STARTUP_COMMAND_1: ../wait-proto.sh
      STARTUP_COMMAND_2: ../npm-install.sh
      NODE_ENV: development
      PROMETHEUS_AUTHORIZATION_TOKEN: $PROMETHEUS_AUTHORIZATION_TOKEN
      ENABLE_BASIC_AUTHENTICATION: 'true'
      AUTHENTICATION_USER: john.doe
      AUTHENTICATION_PASSWORD: password
      ENABLE_BEARER_AUTHENTICATION: 'true'
      AUTHENTICATION_TOKEN: '123'
      API_URL: back:50051
      SENTRY_DSN: ${SENTRY_DSN_MAPSTORAGE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      PATH_PREFIX: /map-storage
      MAP_STORAGE_API_TOKEN: FFVSGBSGBSGFB23SFGBSFG4BS
      PUSHER_URL: https://aldeia.primatus.com.br/
      WHITELISTED_RESOURCE_URLS: ''
      SECRET_KEY: $SECRET_KEY
    volumes:
    - .:/usr/src/app
    tmpfs: /tmp
    labels:
    - traefik.enable=true
    - traefik.http.middlewares.strip-map-storage-prefix.stripprefix.prefixes=/map-storage
    - traefik.http.routers.map-storage.rule=Host(`aldeia.primatus.com.br`) && PathPrefix(`/map-storage`)
    - traefik.http.routers.map-storage.priority=2
    - traefik.http.routers.map-storage.middlewares=strip-map-storage-prefix@docker
    - traefik.http.routers.map-storage.entryPoints=web
    - traefik.http.routers.map-storage.service=map-storage
    - traefik.http.services.map-storage.loadbalancer.server.port=3000
    - traefik.http.routers.map-storage-ui.rule=Host(`aldeia.primatus.com.br`) && PathPrefix(`/map-storage/ui/`)
    - traefik.http.routers.map-storage-ui.priority=3
    - traefik.http.routers.map-storage-ui.middlewares=strip-map-storage-prefix@docker
    - traefik.http.routers.map-storage-ui.entryPoints=web
    - traefik.http.routers.map-storage-ui.service=map-storage-ui
    - traefik.http.services.map-storage-ui.loadbalancer.server.port=8080
  uploader:
    image: thecodingmachine/nodejs:v2-20-bullseye
    command: npm run dev
    working_dir: /usr/src/app/uploader
    environment:
      DEBUG: '*'
      STARTUP_COMMAND_1: ../npm-install.sh
      UPLOADER_URL: https://aldeia.primatus.com.br/uploader
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      UPLOADER_AWS_SIGNED_URL_EXPIRATION: ${UPLOADER_AWS_SIGNED_URL_EXPIRATION:-}
      REDIS_HOST: ${UPLOADER_REDIS_HOST:-}
      REDIS_PORT: ${UPLOADER_REDIS_PORT:-}
      REDIS_DB_NUMBER: ${UPLOADER_REDIS_DB_NUMBER:-}
      ENABLE_CHAT_UPLOAD: $ENABLE_CHAT_UPLOAD
      UPLOAD_MAX_FILESIZE: ${UPLOAD_MAX_FILESIZE:-}
    volumes:
    - .:/usr/src/app
    tmpfs: /tmp
    labels:
    - traefik.enable=true
    - traefik.http.middlewares.strip-uploader-prefix.stripprefix.prefixes=/uploader
    - traefik.http.routers.uploader.rule=Host(`aldeia.primatus.com.br`) && PathPrefix(`/uploader`)
    - traefik.http.routers.uploader.priority=2
    - traefik.http.routers.uploader.middlewares=strip-uploader-prefix@docker
    - traefik.http.routers.uploader.entryPoints=web
    - traefik.http.routers.uploader.service=uploader
    - traefik.http.services.uploader.loadbalancer.server.port=8080
  messages:
    image: thecodingmachine/nodejs:v2-20-bullseye-build
    environment:
      STARTUP_COMMAND_1: npm install
      STARTUP_COMMAND_2: npm run proto:watch
    volumes:
    - ./messages:/usr/src/app
    - ./back:/usr/src/back
    - ./play:/usr/src/play
    - ./map-storage:/usr/src/map-storage
    - ./libs:/usr/src/libs
  redis:
    image: redis:6
  icon:
    image: matthiasluedtke/iconserver:v3.21.0
    labels:
    - traefik.enable=true
    - traefik.http.middlewares.strip-icon-prefix.stripprefix.prefixes=/icon
    - traefik.http.routers.icon.rule=Host(`aldeia.primatus.com.br`) && PathPrefix(`/icon`)
    - traefik.http.routers.icon.priority=2
    - traefik.http.routers.icon.middlewares=strip-icon-prefix@docker
    - traefik.http.routers.icon.entryPoints=web
    - traefik.http.routers.icon.service=icon
    - traefik.http.services.icon.loadbalancer.server.port=8080
